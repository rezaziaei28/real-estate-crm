services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malekflow_backend
    volumes:
      - ./core:/app
    ports:
      - "8000:8000"
    command: python3 manage.py runserver 0.0.0.0:8000
    environment:
      - SECRET_KEY=test
      - DEBUG=True

  db:
    image: docker.arvancloud.ir/postgres:15
    container_name: malekflow_db
    environment:
      POSTGRES_DB: malekflow_db
      POSTGRES_USER: malekflow_user
      POSTGRES_PASSWORD: malekflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
